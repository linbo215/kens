name: hb_telecom_scan

on:
  workflow_dispatch:

# 推送需要写权限
permissions:
  contents: write

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 🚚 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 完整历史，避免 push 时各种浅克隆问题

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp tqdm

      - name: 🚀 执行扫描脚本
        run: |
          mkdir -p py
          python py/hb_telecom_scan.py

      - name: 💾 提交扫描结果
        run: |
          # 修复容器内的 safe.directory 报错（新版本 Git 常见）
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 只添加实际存在的文件，避免 pathspec 报错
          for f in py/hb_telecom.m3u py/hb_telecom_tvbox.txt py/scanned_history.json; do
            if [ -f "$f" ]; then
              git add -f "$f"      # -f 防止被 .gitignore 拦截
            else
              echo "⚠️ 文件不存在，跳过: $f"
            fi
          done

          if git diff --staged --quiet; then
            echo "没有发现新变动，跳过提交。"
          else
            git commit -m "📡 自动更新直播源: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
